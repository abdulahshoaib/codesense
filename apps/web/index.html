<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CodeSense — developer-focused code intelligence for your repositories."
    />
    <title>CodeSense</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("codesense-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark = stored === "dark" || ((!stored || stored === "system") && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (_error) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
